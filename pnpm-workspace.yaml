# pnpm 11 re-runs a dependency check (and install) before EVERY `pnpm run`
# script. On this project that is actively harmful: the install re-links
# `node_modules`, which deletes the unpacked `node_modules/electron/dist/` — so
# the Electron binary vanishes and `pnpm dev` can't start the app it just built.
# It also drags better-sqlite3's native rebuild into unrelated commands
# (`pnpm test`, `pnpm lint`), which fails without VS C++ build tools even though
# those commands never touch it.
#
# Dependencies are still installed normally via an explicit `pnpm install`;
# this only disables the implicit one. (`scripts/postinstall.mjs` repairs the
# Electron binary when an install does run.)
verifyDepsBeforeRun: false

overrides:
  "node-hid>node-addon-api": "^8.7.0"
  # @electron/rebuild's own node-abi dependency doesn't yet map newer
  # Electron majors' ABI numbers (e.g. 43.x) — force a version whose
  # registry includes them so native module rebuilds don't fail with
  # "Could not detect abi for version <electron version>".
  node-abi: "^4.33.0"

# pnpm 11's default minimumReleaseAge cooldown rejects lockfile entries
# published too recently. These three were resolved during a deliberate
# 2026-08 dependency upgrade pass (electron 41 -> 43, better-sqlite3 12 -> 13,
# electron-builder 26.7 -> 26.15 which pulls a fresher pvutils transitively)
# and were reviewed as part of that PR, not picked up incidentally — the
# cooldown otherwise stays active for future updates.
minimumReleaseAgeExclude:
  - electron@43.3.0
  - better-sqlite3@13.0.3
  - pvutils@1.2.0

# Replaces the old package.json pnpm.onlyBuiltDependencies / this file's
# own allowedBuiltDependencies list (pnpm 11 superseded both with this
# per-package map). Native modules, electron's own binary download, and
# esbuild's binary install all need their scripts; core-js's postinstall
# is just a sponsorship console message (no build); electron-winstaller's
# copies a bundled 7z binary for the Windows NSIS/Squirrel packaging step
# electron-builder needs.
allowBuilds:
  '@paymoapp/active-window': true
  # better-sqlite3's install script runs node-gyp, which compiles from SOURCE and
  # fails without Visual Studio C++ build tools (`gyp ERR! find VS`). That
  # failure aborts the whole install — before pnpm creates `node_modules/.bin`
  # shims and before electron unpacks its binary — so `pnpm dev` then fails with
  # "'electron-vite' is not recognized" and there is no electron.exe to launch.
  #
  # It doesn't need building: the package ships prebuilt binaries including
  # `prebuilds/win32-x64.node`, which load fine (verified by launching the app).
  # Set this to `true` on a machine WITH build tools if you want a real rebuild;
  # `pnpm rebuild` remains available either way.
  better-sqlite3: false
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  node-hid: true

